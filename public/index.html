<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrackNest — Affiliate Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#0E1120; --panel:#161A2E; --panel2:#1E2338; --line:#2A2F4A;
    --txt:#E7E9F5; --muted:#8A8FB3; --accent:#5EEAD4; --accent2:#818CF8;
    --danger:#FB7185; --ok:#4ADE80;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="light"]{
    --bg:#F3F4F8; --panel:#FFFFFF; --panel2:#F0F1F7; --line:#E1E3EE;
    --txt:#171A2B; --muted:#6B7090; --accent:#0F9E8C; --accent2:#5B5FEA;
    --danger:#E11D48; --ok:#16A34A;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{background:var(--bg); color:var(--txt); font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; height:100%; margin:0; overflow-x:hidden;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px;}
  .navitem{display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px; color:var(--muted); cursor:pointer; font-size:14.5px; position:relative;}
  .navitem:hover{background:var(--panel2); color:var(--txt);}
  .navitem.active{background:linear-gradient(90deg,rgba(94,234,212,.15),transparent); color:var(--accent); font-weight:600;}
  .subitem{padding:8px 14px 8px 40px; color:var(--muted); cursor:pointer; font-size:13.5px; border-radius:8px; display:flex; align-items:center; justify-content:space-between;}
  .subitem:hover{background:var(--panel2); color:var(--txt);}
  .subitem.active{color:var(--accent); font-weight:600;}
  input,select,textarea{background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px 10px; font-size:14px; width:100%;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent);}
  .btn{background:var(--accent); color:#06251F; font-weight:600; border-radius:9px; padding:8px 16px; font-size:14px; cursor:pointer; border:none; display:inline-block;}
  .btn:hover{filter:brightness(1.08);}
  .btn2{background:transparent; border:1px solid var(--line); color:var(--txt); border-radius:9px; padding:6px 12px; font-size:13px; cursor:pointer; display:inline-block;}
  .btn2:hover{border-color:var(--accent2);}
  .pill{padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{color:var(--muted); text-align:left; font-weight:500; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:9px 10px; border-bottom:1px solid var(--line);}
  ::-webkit-scrollbar{width:8px; height:8px;} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .msg-me{background:var(--accent2); color:#fff; align-self:flex-end; border-radius:12px 12px 2px 12px;}
  .msg-other{background:var(--panel2); align-self:flex-start; border-radius:12px 12px 12px 2px;}
  .sidebar{position:fixed; top:0; left:0; height:100%; width:270px; transform:translateX(-100%); transition:transform .25s ease; z-index:50;}
  .sidebar.open{transform:translateX(0);}
  .main{transition:margin-left .25s ease; min-height:100%;}
  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40;}
  .switch{width:40px; height:22px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); position:relative; cursor:pointer; flex-shrink:0;}
  .switch .dot{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:999px; background:var(--muted); transition:.2s;}
  .switch.on .dot{transform:translateX(18px); background:var(--accent);}
  .dotstatus{width:8px; height:8px; border-radius:999px; display:inline-block; margin-right:5px;}
  .badge-red{position:absolute; top:6px; left:26px; width:8px; height:8px; background:var(--danger); border-radius:999px;}
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:80; display:flex; align-items:center; justify-content:center; padding:16px;}
  .toast{position:fixed; top:16px; right:16px; z-index:90; background:var(--panel2); border:1px solid var(--accent); border-radius:10px; padding:10px 14px; font-size:13.5px; box-shadow:0 6px 20px rgba(0,0,0,.3); max-width:280px;}
  .bottomnav{position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--panel); border-top:1px solid var(--line); z-index:45; padding-bottom:env(safe-area-inset-bottom,0px);}
  .bottomnav-item{flex:1; text-align:center; padding:7px 2px 9px; font-size:10.5px; color:var(--muted); cursor:pointer;}
  .bottomnav-item.active{color:var(--accent); font-weight:600;}
  @media (max-width:767px){ .main{padding-bottom:58px;} }
  @media print{
    body *{visibility:hidden;}
    .invoice-print, .invoice-print *{visibility:visible;}
    .invoice-print{position:absolute; top:0; left:0; width:100%; padding:20px;}
  }

/* Premium authentication page */
.auth-shell{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:radial-gradient(circle at 15% 15%,rgba(20,184,166,.18),transparent 35%),linear-gradient(135deg,#07111f,#0b1728 52%,#0f2430);padding:28px;}
.auth-brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;color:#fff;margin-bottom:46px}
.auth-logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2dd4bf,#38bdf8);box-shadow:0 12px 35px rgba(45,212,191,.25);color:#06251f;font-weight:900}
.auth-left{display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,6vw,90px);color:#fff}
.auth-left h1{font-size:clamp(34px,4.5vw,64px);line-height:1.02;letter-spacing:-.04em;margin:0 0 20px;font-weight:850}
.auth-left p{max-width:620px;color:#b8c7d9;font-size:16px;line-height:1.7}
.auth-points{display:grid;gap:12px;margin-top:28px}.auth-point{display:flex;gap:10px;align-items:center;color:#dbe7f3}.auth-check{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(45,212,191,.14);color:#5eead4;font-size:13px}
.auth-right{display:flex;align-items:center;justify-content:center}.auth-card{width:min(460px,100%);padding:34px;background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.35);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.auth-card h2{margin:0;font-size:28px;letter-spacing:-.02em;color:#102033}.auth-card .auth-sub{margin:7px 0 25px;color:#66768a;font-size:14px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#eef3f7;border-radius:12px;margin-bottom:22px}.auth-tab{padding:11px;text-align:center;border-radius:9px;color:#6b7b8d;font-weight:700;cursor:pointer}.auth-tab.active{background:#fff;color:#102033;box-shadow:0 3px 12px rgba(15,23,42,.08)}
.auth-card input{width:100%;box-sizing:border-box;margin-bottom:13px!important;padding:13px 14px!important;border:1px solid #d7e0e9!important;border-radius:11px!important;background:#fff!important;color:#172334!important;font-size:14px}.auth-card input:focus{border-color:#14b8a6!important;box-shadow:0 0 0 3px rgba(20,184,166,.12)!important;outline:none}.auth-submit{width:100%;border:0;padding:13px;border-radius:11px;background:linear-gradient(135deg,#14b8a6,#0ea5e9);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 25px rgba(14,165,233,.2)}
.auth-links{display:flex;justify-content:space-between;align-items:center;margin-top:15px;font-size:13px}.auth-links a{color:#0f766e;font-weight:700;cursor:pointer}.auth-note{text-align:center;margin-top:22px;color:#8391a1;font-size:12px}.auth-error{padding:10px 12px;border-radius:10px;background:#fff1f2;color:#be123c;font-size:13px;margin-bottom:14px}
@media(max-width:850px){.auth-shell{grid-template-columns:1fr;padding:16px}.auth-left{display:none}.auth-right{min-height:calc(100vh - 32px)}.auth-card{padding:26px 22px;border-radius:20px}}
</style>
</head>
<body>
<div id="app" class="h-full"></div>
<div id="toastHost"></div>

<script>
const LS_KEY='tracknest_state_v3';
const uid=()=>Math.random().toString(36).slice(2,9);
const now=()=>new Date().toISOString();
const fmt=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const isMobile=()=>window.innerWidth<768;

function seed(){
  const days=[...Array(7)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));return d.toISOString().slice(0,10);});
  return {
    role:'user', theme:'dark', sidebarOpen:!isMobile(), impersonating:null,
    nav:'dashboard', sub:'', chatContact:null, antiFraud:true, lastClick:{},
    users:[
      {id:'you',name:'You (Rakib)',online:true,role:'user',status:'active',subRole:'none',device:'Chrome · Windows'},
      {id:'admin',name:'Admin',online:true,role:'admin',status:'active',subRole:'none',device:'Chrome · macOS'},
      {id:'u_mim',name:'Mim',online:true,role:'user',status:'active',subRole:'none',device:'Chrome Mobile · Android (Samsung A52)'},
      {id:'u_karim',name:'Karim',online:false,role:'user',status:'active',subRole:'none',device:'Safari · iPhone 13'},
    ],
    userWallets:{
      you:{main:12480.50, withdrawal:3200, pending:940},
      u_mim:{main:5400, withdrawal:1200, pending:300},
      u_karim:{main:2100, withdrawal:400, pending:0},
    },
    offers:[
      {id:uid(),name:'ShopNix Fashion App Install',url:'https://track.example.com/shopnix?click_id={click_id}',payout:4.5,category:'App Install',country:'Bangladesh',device:'Android',dailyCap:10,s2s:'https://tracknest.dev/pb?click_id={click_id}&payout={payout}&status={status}',status:'active',joined:true},
      {id:uid(),name:'EzyLoan — Loan Signup',url:'https://track.example.com/ezyloan?click_id={click_id}',payout:12,category:'CPL',country:'Bangladesh',device:'Any',dailyCap:5,s2s:'https://tracknest.dev/pb?click_id={click_id}&payout={payout}&status={status}',status:'active',joined:true},
      {id:uid(),name:'BD Mart — First Order',url:'https://track.example.com/bdmart?click_id={click_id}',payout:6,category:'CPS',country:'Bangladesh',device:'iOS',s2s:'https://tracknest.dev/pb?click_id={click_id}&payout={payout}&status={status}',status:'paused',joined:false},
      {id:uid(),name:'FitPro — Free Trial Signup',url:'https://track.example.com/fitpro?click_id={click_id}',payout:8,category:'CPL',country:'India',device:'Any',s2s:'https://tracknest.dev/pb?click_id={click_id}&payout={payout}&status={status}',status:'active',joined:false},
    ],

    withdrawals:[
      {id:uid(),user:'u_mim',amount:15,method:'bKash',number:'01711000000',status:'pending',date:now()},
      {id:uid(),user:'you',amount:8,method:'Nagad',number:'01911000000',status:'approved',date:now()},
    ],
    chatGlobal:[{from:'admin',name:'Admin',text:'Welcome! Everyone can chat together here.',time:now()}],
    dms:{},
    notices:[],
    accounts:[
      {id:'you',username:'rakib',email:'rakib@example.com',phone:'01700000000',password:'123456',role:'user'},
      {id:'admin',username:'shuvobroto',email:'admin@tracknest.com',phone:'01711111111',password:'shuvo.broto',role:'admin'},
    ],
    session:null, authTab:'login', authError:'',
    referrals:[],
    conversions:[], s2sLogs:[], fraudLogs:[],
    offerFilter:{q:'',category:'',country:'',device:''},
    lang:'en', bellOpen:false,
    offerUsage:{}, auditLog:[],
    faqs:[
      {q:'How do I get paid?',a:'Request a withdrawal from the Payment page using bKash, Nagad or Rocket. Admin approves it and funds move from Pending to your chosen method.'},
      {q:'Why was my click blocked?',a:'Anti-Fraud Protection blocks the same offer link if requested twice within 15 seconds, to prevent accidental self-clicks.'},
      {q:'What is a daily cap?',a:'Some offers limit how many clicks/conversions are allowed per day per user. You will see a progress bar on the offer card once you are close to the limit.'},
      {q:'How does the referral program work?',a:'Share your referral link from the Dashboard. You earn a bonus for every friend who joins using it.'},
    ],
    tickets:[],
    legalOpen:'',
    statsRange:{from:'',to:''}, emailSmsEnabled:true,
  };
}
let state = JSON.parse(localStorage.getItem(LS_KEY)||'null') || seed();
if(state.sidebarOpen===undefined) state.sidebarOpen=!isMobile();
if(!state.theme) state.theme='dark';
if(state.antiFraud===undefined) state.antiFraud=true;
if(!state.lastClick) state.lastClick={};
if(!state.dms) state.dms={};
if(state.chatContact===undefined) state.chatContact=null;
if(!state.notices) state.notices=[];
if(!state.accounts) state.accounts=[
  {id:'you',username:'rakib',email:'rakib@example.com',phone:'01700000000',password:'123456',role:'user'},
  {id:'admin',username:'shuvobroto',email:'admin@tracknest.com',phone:'01711111111',password:'shuvo.broto',role:'admin'},
];
if(state.session===undefined) state.session=null;
// Admin credential migration: keep the single built-in admin account consistent.
try{
  const adminAcc=state.accounts.find(a=>a.role==='admin' || a.id==='admin');
  if(adminAcc){ adminAcc.id='admin'; adminAcc.username='shuvobroto'; adminAcc.password='shuvo.broto'; adminAcc.role='admin'; }
}catch(e){}
if(!state.authTab) state.authTab='login';
if(state.authError===undefined) state.authError='';
if(!state.referrals) state.referrals=[];
if(!state.conversions) state.conversions=[];
if(!state.s2sLogs) state.s2sLogs=[];
if(!state.fraudLogs) state.fraudLogs=[];
if(!state.offerFilter) state.offerFilter={q:'',category:'',country:'',device:''};
if(!state.lang) state.lang='en';
if(state.bellOpen===undefined) state.bellOpen=false;
state.offers.forEach(o=>{ if(!o.country) o.country='Any'; if(!o.device) o.device='Any'; });
if(!state.offerUsage) state.offerUsage={};
if(!state.auditLog) state.auditLog=[];
if(!state.faqs) state.faqs=[
  {q:'How do I get paid?',a:'Request a withdrawal from the Payment page using bKash, Nagad or Rocket. Admin approves it and funds move from Pending to your chosen method.'},
  {q:'Why was my click blocked?',a:'Anti-Fraud Protection blocks the same offer link if requested twice within 15 seconds, to prevent accidental self-clicks.'},
  {q:'What is a daily cap?',a:'Some offers limit how many clicks/conversions are allowed per day per user. You will see a progress bar on the offer card once you are close to the limit.'},
  {q:'How does the referral program work?',a:'Share your referral link from the Dashboard. You earn a bonus for every friend who joins using it.'},
];
if(!state.tickets) state.tickets=[];
if(!state.statsRange) state.statsRange={from:'',to:''};
if(state.emailSmsEnabled===undefined) state.emailSmsEnabled=true;
if(state.userSearch===undefined) state.userSearch='';
if(state.legalOpen===undefined) state.legalOpen='';
state.users.forEach(u=>{ if(!u.status) u.status='active'; if(!u.subRole) u.subRole='none'; if(!u.device) u.device='Unknown device'; });
function generatePublicUserId(){
  const used=new Set(state.users.map(u=>String(u.publicId||'')).filter(x=>/^\d{5}$/.test(x)));
  if(used.size>=90000) throw new Error('No available 5-digit User IDs');
  let id; do { id=String(Math.floor(10000+Math.random()*90000)); } while(used.has(id));
  return id;
}
function ensurePublicUserIds(){
  const used=new Set();
  state.users.forEach(u=>{
    const id=String(u.publicId||'');
    if(/^\d{5}$/.test(id) && !used.has(id)){ used.add(id); u.publicId=id; }
    else { u.publicId=generatePublicUserId(); used.add(u.publicId); }
  });
}
ensurePublicUserIds();
function userPublicId(id){ const u=state.users.find(x=>x.id===id); return u&&u.publicId ? u.publicId : ''; }
try{ const meU=state.users.find(u=>u.id==='you'); if(meU) meU.device = navigator.userAgent.slice(0,60); }catch(e){}
const REF_BONUS=2;
const T={
  en:{dashboard:'Dashboard',offers:'Offers',all_offers:'All Offers',available_offers:'Available Offers',active_offers:'Active Offers',statistics:'Statistics',payment:'Payment',chat:'Chat',global_chat:'Global Chat',personal_chat:'Personal Chat',users:'Users',security:'Security',s2s_logs:'S2S Logs',fraud_reports:'Fraud Reports',admin_panel:'Admin Panel',user_panel:'User Panel',main_balance:'Main Balance',dark_light:'Dark / Light Mode',language:'Language'},
  bn:{dashboard:'ড্যাশবোর্ড',offers:'অফার',all_offers:'সকল অফার',available_offers:'উপলব্ধ অফার',active_offers:'সক্রিয় অফার',statistics:'স্ট্যাটিসটিক্স',payment:'পেমেন্ট',chat:'চ্যাট',global_chat:'গ্লোবাল চ্যাট',personal_chat:'পার্সোনাল চ্যাট',users:'ইউজারগণ',security:'সিকিউরিটি',s2s_logs:'এস২এস লগ',fraud_reports:'ফ্রড রিপোর্ট',admin_panel:'অ্যাডমিন প্যানেল',user_panel:'ইউজার প্যানেল',main_balance:'মেইন ব্যালেন্স',dark_light:'ডার্ক / লাইট মোড',language:'ভাষা'}
};
function t(k){ return (T[state.lang]&&T[state.lang][k]) || T.en[k] || k; }
function toggleLang(){ state.lang = state.lang==='en'?'bn':'en'; save(); render(); }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function showAuthTab(t){ state.authTab=t; state.authError=''; save(); render(); }
function doLogin(){
  const idf=document.getElementById('authLoginId').value.trim().toLowerCase();
  const pw=document.getElementById('authLoginPw').value;
  const acc=state.accounts.find(a=>a.username.toLowerCase()===idf || a.email.toLowerCase()===idf);
  if(!acc || acc.password!==pw){ state.authError='Invalid username/email or password.'; save(); render(); return; }
  state.session={userId:acc.id}; state.impersonating=null; state.nav='dashboard'; state.authError='';
  save(); render(); checkAndShowNotice();
}
function doSignup(){
  const username=document.getElementById('authSuUser').value.trim();
  const email=document.getElementById('authSuEmail').value.trim();
  const phone=document.getElementById('authSuPhone').value.trim();
  const pw=document.getElementById('authSuPw').value;
  if(!username||!email||!phone){ state.authError='All fields are required.'; save(); render(); return; }
  if(pw.length<6){ state.authError='Password must be at least 6 characters.'; save(); render(); return; }
  if(state.accounts.some(a=>a.username.toLowerCase()===username.toLowerCase()||a.email.toLowerCase()===email.toLowerCase())){
    state.authError='Username or email already exists.'; save(); render(); return;
  }
  const id=uid();
  state.accounts.push({id,username,email,phone,password:pw,role:'user'});
  state.users.push({id,name:username,online:true,role:'user',publicId:generatePublicUserId()});
  state.userWallets[id]={main:0,withdrawal:0,pending:0};
  state.session={userId:id}; state.impersonating=null; state.nav='dashboard'; state.authError='';
  save(); render(); checkAndShowNotice();
}
function logout(){ state.session=null; document.getElementById('noticeHost').innerHTML=''; save(); render(); }

function renderAuthScreen(){
  const err = state.authError ? `<div class="text-sm mb-3" style="color:var(--danger)">${state.authError}</div>` : '';
  const tabs = `<div class="flex rounded-lg overflow-hidden mb-5" style="border:1px solid var(--line)">
    <div onclick="showAuthTab('login')" class="flex-1 text-center py-2 cursor-pointer" style="background:${state.authTab==='login'?'var(--accent)':'transparent'};color:${state.authTab==='login'?'#06251F':'var(--muted)'};font-weight:600">Login</div>
    <div onclick="showAuthTab('signup')" class="flex-1 text-center py-2 cursor-pointer" style="background:${state.authTab==='signup'?'var(--accent)':'transparent'};color:${state.authTab==='signup'?'#06251F':'var(--muted)'};font-weight:600">Sign Up</div>
  </div>`;
  const form = state.authTab==='login' ? `
    <input id="authLoginId" placeholder="Username or Email" class="mb-3">
    <input id="authLoginPw" type="password" placeholder="Password" class="mb-4" onkeydown="if(event.key==='Enter')doLogin()">
    <span class="btn w-full text-center" style="display:block" onclick="doLogin()">Login</span>
    <div class="text-xs mt-3" style="color:var(--muted)">Production login — credentials are verified server-side</div>
  ` : `
    <input id="authSuUser" placeholder="Username" class="mb-3">
    <input id="authSuEmail" placeholder="Email" class="mb-3">
    <input id="authSuPhone" placeholder="Phone Number" class="mb-3">
    <input id="authSuPw" type="password" placeholder="Password (min 6 characters)" class="mb-4" onkeydown="if(event.key==='Enter')doSignup()">
    <span class="btn w-full text-center" style="display:block" onclick="doSignup()">Create Account</span>
  `;
  document.getElementById('app').innerHTML = `<div class="auth-shell">
    <section class="auth-left">
      <div class="auth-brand"><div class="auth-logo">TH</div><span>TrackNest</span></div>
      <h1>Grow your affiliate business with confidence.</h1>
      <p>Manage offers, tracking links, conversions, payouts and performance from one professional affiliate platform.</p>
      <div class="auth-points">
        <div class="auth-point"><span class="auth-check">✓</span><span>Real-time offer & conversion tracking</span></div>
        <div class="auth-point"><span class="auth-check">✓</span><span>Secure S2S postback-ready workflow</span></div>
        <div class="auth-point"><span class="auth-check">✓</span><span>Clear analytics and payout management</span></div>
      </div>
    </section>
    <section class="auth-right"><div class="auth-card">
      <div class="auth-brand" style="color:#102033;margin-bottom:20px"><div class="auth-logo">TH</div><span>TrackNest</span></div>
      <h2>${state.authTab==='login'?'Welcome back':'Create your account'}</h2>
      <div class="auth-sub">${state.authTab==='login'?'Sign in to access your affiliate dashboard.':'Join the network and start managing your offers.'}</div>

function checkAndShowNotice(){
  const me=currentUserId();
  if(me==='admin'){ document.getElementById('noticeHost').innerHTML=''; return; }
  const pending=state.notices.filter(n=>!n.dismissedBy.includes(me));
  if(pending.length===0){ document.getElementById('noticeHost').innerHTML=''; return; }
  const n=pending[pending.length-1];
  document.getElementById('noticeHost').innerHTML=`<div class="modal-overlay" style="z-index:95">
    <div class="card p-6 w-full max-w-sm relative">
      <span class="btn2 absolute" style="top:10px;right:10px;padding:2px 8px" onclick="dismissNotice('${n.id}')">✕</span>

function dismissNotice(id){
  const n=state.notices.find(x=>x.id===id); if(n) n.dismissedBy.push(currentUserId());
  save(); document.getElementById('noticeHost').innerHTML='';
}
function sendNotice(){
  const el=document.getElementById('noticeText'); const text=el.value.trim(); if(!text)return;
  state.notices.push({id:uid(),text,time:now(),dismissedBy:[]});
  logAudit(`Sent notice: "${text.slice(0,40)}${text.length>40?'...':''}"`);
  el.value=''; save();
  showToast('Notice published for all users');
  render();
}

function sessionAccount(){ return state.session ? state.accounts.find(a=>a.id===state.session.userId) : null; }
function sessionRole(){ const a=sessionAccount(); return a ? a.role : null; }
function effRole(){ return state.impersonating ? 'user' : (sessionRole() || 'user'); }
function currentUserId(){ const a=sessionAccount(); if(!a) return null; return a.role==='admin' ? (state.impersonating || a.id) : a.id; }
function userName(id){ const u=state.users.find(u=>u.id===id); return u?u.name:id; }
function userEmail(id){ const acc=state.accounts.find(a=>a.id===id); return acc ? acc.email : (id+'@tracknest.app'); }
function userOnline(id){ const u=state.users.find(u=>u.id===id); return u?u.online:false; }
function walletOf(id){ if(!state.userWallets[id]) state.userWallets[id]={main:0,withdrawal:0,pending:0}; return state.userWallets[id]; }
function offerUsageToday(userId,offerId){ return state.offerUsage[`${userId}_${offerId}_${now().slice(0,10)}`]||0; }
function incOfferUsage(userId,offerId){ const k=`${userId}_${offerId}_${now().slice(0,10)}`; state.offerUsage[k]=(state.offerUsage[k]||0)+1; }
function logAudit(action){ state.auditLog.push({id:uid(),actor:userName(currentUserId()),action,time:now()}); }
function threadKey(a,b){ return [a,b].sort().join('|'); }
function unreadCountFor(me,other){
  const arr=state.dms[threadKey(me,other)]||[];
  return arr.filter(m=>m.from===other && !m.seen).length;
}
function totalUnread(){
  const me=currentUserId();
  return state.users.filter(u=>u.id!==me).reduce((a,u)=>a+unreadCountFor(me,u.id),0);
}

function sparkline(){
  const serverDays=state.serverStats&&state.serverStats.daily||null;
  const days=serverDays?Object.keys(serverDays):Object.keys(state.clicksByDay);
  const clicks=days.map(d=>serverDays?Number(serverDays[d].clicks||0):state.clicksByDay[d].clicks);
  const conv=days.map(d=>serverDays?Number(serverDays[d].conversions||0):state.clicksByDay[d].conv);
  const W=560,H=160,pad=20, maxC=Math.max(...clicks,1);
  const pts=arr=>arr.map((v,i)=>`${pad+i*((W-2*pad)/(arr.length-1))},${H-pad-(v/maxC)*(H-2*pad)}`).join(' ');
  const dots=(arr,color)=>arr.map((v,i)=>`<circle cx="${pad+i*((W-2*pad)/(arr.length-1))}" cy="${H-pad-(v/maxC)*(H-2*pad)}" r="3.5" fill="${color}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-36 sm:h-40">
    <polyline points="${pts(clicks)}" fill="none" stroke="var(--accent2)" stroke-width="2.5"/>
    <polyline points="${pts(conv)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    ${dots(clicks,'#818CF8')}${dots(conv,'#5EEAD4')}
  </svg>
  <div class="flex gap-4 text-xs mt-1" style="color:var(--muted)">
    <span><span style="color:var(--accent2)">●</span> Clicks</span>
    <span><span style="color:var(--accent)">●</span> Conversions</span>
  </div>`;
}

function importCSV(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const lines=ev.target.result.split('\n').map(l=>l.trim()).filter(Boolean);
    let count=0;
    lines.forEach(line=>{
      const p=line.split(',');
      if(p.length<4) return;
      state.offers.push({id:uid(),name:p[0].trim(),url:p[1].trim(),payout:Number(p[2])||0,category:(p[3]||'General').trim(),country:(p[4]||'Any').trim(),device:(p[5]||'Any').trim(),s2s:'',status:'active',joined:false});
      count++;
    });
    save(); render(); showToast(`${count} offers imported`);
  };
  reader.readAsText(file);
}

function exportCSV(kind){
  let header=[], rows=[];
  if(kind==='withdrawals'){ header=['User','Amount','Method','Number','Status','Date']; rows=state.withdrawals.map(w=>[userName(w.user),w.amount,w.method,w.number,w.status,w.date]); }
  else { header=['Date','User','Offer','Amount']; rows=state.conversions.map(c=>[c.date,userName(c.userId),c.offerName,c.amount]); }
  const csv=[header.join(','), ...rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=`${kind}-export.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast('CSV exported successfully');
}

/* TrackNest production API bridge */
const API_TOKEN_KEY='tracknest_api_token';
const apiToken=()=>localStorage.getItem(API_TOKEN_KEY)||'';
async function apiCall(path,body,method='POST'){
 const r=await fetch(path,{method,headers:{'content-type':'application/json',...(apiToken()?{Authorization:'Bearer '+apiToken()}: {})},body:method==='GET'?undefined:JSON.stringify(body||{})});
 const d=await r.json().catch(()=>({ok:false,message:'Invalid server response'})); if(!r.ok) throw new Error(d.message||'Request failed'); return d;
}
async function syncServerUsers(){try{const d=await apiCall('/api/users',null,'GET');if(d.users)state.users=d.users.map(u=>({id:u.id,name:u.name||u.username,username:u.username,email:u.email,phone:u.phone,online:false,role:u.role,status:u.status,subRole:u.sub_role||'none',publicId:String(u.public_id||''),device:u.device||'Server account'}));save();}catch(e){}}
async function syncServerOffers(){try{const d=await apiCall('/api/offers',null,'GET');if(d.offers)state.offers=d.offers.map(o=>({...o,id:String(o.id),dailyCap:o.daily_cap||null,status:o.status,joined:Boolean(state.offers.find(x=>String(x.id)===String(o.id)&&x.joined))}));save();}catch(e){}}
async function refreshServerStats(){try{const d=await apiCall('/api/stats',null,'GET');if(d.ok){state.serverStats=d;save();if(state.nav==='statistics')render();}}catch(e){}}
async function syncServerWithdrawals(){if(effRole()!=='admin')return;try{const d=await apiCall('/api/wallet',{action:'list'});if(d.withdrawals)state.withdrawals=d.withdrawals.map(w=>({id:w.id,user:w.user_id,amount:Number(w.amount),method:w.method,number:w.account_number,status:w.status,date:w.created_at}));save();}catch(e){}}
async function restoreServerSession(){
 const t=apiToken(); if(!t)return;
 try{const d=await apiCall('/api/auth',{action:'me'}); if(d.user){state.session={userId:d.user.id};state.role=d.user.role;await syncServerUsers();await syncServerOffers();await syncServerWithdrawals();await refreshServerStats();state.nav='dashboard';render();loadServerWallet();}}
 catch(e){localStorage.removeItem(API_TOKEN_KEY);state.session=null;}
}

const legacyDoSignup=doSignup;
doSignup=async function(){
 const username=document.getElementById('authSuUser').value.trim(),email=document.getElementById('authSuEmail').value.trim(),phone=document.getElementById('authSuPhone').value.trim(),password=document.getElementById('authSuPw').value;
 try{const d=await apiCall('/api/auth',{action:'signup',username,email,phone,password});localStorage.setItem(API_TOKEN_KEY,d.token);state.session={userId:d.user.id};state.nav='dashboard';state.authError='';render();}
 catch(e){state.authError=e.message;render();}
};
const legacyLogout=logout;
logout=async function(){try{await apiCall('/api/auth',{action:'logout'});}catch(e){}localStorage.removeItem(API_TOKEN_KEY);state.session=null;state.impersonating=null;render();};
const legacySendGlobal=sendGlobal;
sendGlobal=async function(){const inp=document.getElementById('chatInput'),text=inp.value.trim();if(!text)return;try{await apiCall('/api/chat',{kind:'global',text});inp.value='';await refreshGlobalChat();}catch(e){showToast(e.message);}};
const legacySendDM=sendDM;
sendDM=async function(){const inp=document.getElementById('dmInput'),text=inp.value.trim();if(!text||!state.chatContact)return;try{await apiCall('/api/chat',{kind:'dm',userId:state.chatContact,text});inp.value='';await refreshDMChat();}catch(e){showToast(e.message);}};
async function refreshGlobalChat(){try{const d=await apiCall('/api/chat?kind=global',null,'GET');state.chatGlobal=(d.messages||[]).map(m=>({id:m.id,from:m.sender_id,name:(m.users&&m.users.name)||userName(m.sender_id),text:m.body,time:m.created_at,name:(m.users&&m.users.name)||userName(m.sender_id)}));render();}catch(e){}}
async function refreshDMChat(){try{const d=await apiCall('/api/chat?kind=dm&userId='+encodeURIComponent(state.chatContact),null,'GET');const k=threadKey(currentUserId(),state.chatContact);state.dms[k]=(d.messages||[]).map(m=>({id:m.id,from:m.sender_id,text:m.body,time:m.created_at,seen:true,edited:Boolean(m.edited_at)}));render();}catch(e){}}
setInterval(()=>{if(state.session&&apiToken()){if(state.nav==='chat')refreshGlobalChat();if(state.chatContact)refreshDMChat();if(state.nav==='statistics')refreshServerStats();if(effRole()==='admin'&&state.nav==='payment')syncServerWithdrawals();}},5000);
const legacyRequestWd=requestWd;
requestWd=async function(){
 const amt=Number(document.getElementById('wdAmt').value||0),account=document.getElementById('wdNumber').value.trim(),method=document.getElementById('wdMethod').value;
 if(amt<=0||!account)return alert('Enter a valid amount and account number');
 try{await apiCall('/api/wallet',{action:'withdraw',amount:amt,method,account_number:account});showToast('Withdrawal request submitted');await loadServerWallet();}catch(e){showToast(e.message);}
};

restoreServerSession();

render();
if(state.session&&apiToken()) refreshServerStats();
if(state.nav==='dashboard') checkAndShowNotice();
</script>
</body>
</html>
