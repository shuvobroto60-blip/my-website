<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Social Affiliate Network Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg-main: #090d16;
    --sidebar-bg: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --primary: #10b981;
    --primary-glow: rgba(16, 185, 129, 0.15);
    --accent: #f59e0b;
    --verified: #3b82f6;
    --danger: #ef4444;
    --text-title: #f8fafc;
    --text-body: #94a3b8;
    --text-muted: #64748b;
    --font-ui: 'Plus Jakarta Sans', sans-serif;
    --font-code: 'JetBrains Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; background: var(--bg-main); color: var(--text-title); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }

  /* Main Layout */
  .app-container { display: flex; min-height: 100vh; }
  aside { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--card-border); display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 50; }
  .sidebar-header { padding: 20px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--card-border); }
  .logo-box { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), #059669); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #000; font-size: 18px; }
  .logo-text { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }

  .nav-list { list-style: none; padding: 16px 12px; margin: 0; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; color: var(--text-body); font-weight: 600; font-size: 13.5px; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; }
  .nav-item:hover, .nav-item.active { background: var(--primary-glow); color: var(--primary); }

  main { flex: 1; margin-left: 260px; padding: 24px 32px 80px; width: calc(100% - 260px); }

  /* Header Bar */
  .top-navbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .search-input { background: var(--sidebar-bg); border: 1px solid var(--card-border); padding: 10px 16px; border-radius: 20px; color: #fff; font-size: 13px; width: 300px; }
  .user-profile { display: flex; align-items: center; gap: 12px; background: var(--sidebar-bg); border: 1px solid var(--card-border); padding: 6px 14px; border-radius: 30px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #000; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; position: relative; }
  .badge-verified { color: var(--verified); font-size: 14px; margin-left: 4px; }

  /* Feed & Dashboard Cards */
  .content-grid { display: grid; grid-template-columns: 1fr 300px; gap: 24px; }
  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; backdrop-filter: blur(12px); margin-bottom: 20px; }

  /* Metrics Grid */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .metric-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; }
  .metric-label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
  .metric-value { font-size: 24px; font-weight: 800; font-family: var(--font-code); margin: 6px 0 2px; }

  /* Inputs & Buttons */
  .post-input, input, select { width: 100%; background: var(--bg-main); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px; color: #fff; font-family: inherit; margin-bottom: 10px; }
  .btn { padding: 8px 16px; border-radius: 8px; border: none; font-weight: 700; font-size: 12.5px; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: var(--primary); color: #000; }
  .btn-secondary { background: var(--sidebar-bg); color: var(--text-title); border: 1px solid var(--card-border); }

  /* Post Item */
  .post-item { border-bottom: 1px solid var(--card-border); padding-bottom: 16px; margin-bottom: 16px; }
  .post-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .post-author { display: flex; align-items: center; gap: 10px; }
  .post-actions { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--text-muted); }
  .action-btn { cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .action-btn:hover { color: var(--primary); }

  /* User Row */
  .user-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--card-border); }

  /* Modal & Tabs */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal-box { background: var(--sidebar-bg); border: 1px solid var(--card-border); padding: 32px; border-radius: 20px; width: 100%; max-width: 380px; }
  .auth-tabs { display: flex; border-bottom: 1px solid var(--card-border); margin-bottom: 16px; }
  .auth-tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; font-weight: 700; color: var(--text-muted); }
  .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

  /* Responsive */
  @media (max-width: 900px) {
    aside { transform: translateX(-100%); }
    main { margin-left: 0; width: 100%; padding: 16px; }
    .content-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- Navigation Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo-box">⚡</div>
      <div class="logo-text">LinkFlow Social</div>
    </div>
    <ul class="nav-list">
      <li class="nav-item active" id="nav-feed" onclick="switchTab('feed')"><span>🏠</span> Social Feed</li>
      <li class="nav-item" id="nav-affiliate" onclick="switchTab('affiliate')"><span>📊</span> Affiliate Hub</li>
      <li class="nav-item" id="nav-friends" onclick="switchTab('friends')"><span>👥</span> Friends & Requests</li>
      <li class="nav-item" id="nav-offers" onclick="switchTab('offers')"><span>🔥</span> CPA Offers</li>
      <li class="nav-item" id="adminTab" style="display:none;" onclick="switchTab('admin')"><span>⚙️</span> Admin Control</li>
    </ul>
  </aside>

  <!-- Main View -->
  <main>
    <div class="top-navbar">
      <input type="text" class="search-input" id="searchInput" placeholder="Search posts, #tags, or friends...">
      <div class="user-profile" id="userProfileArea">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Dynamic Content Area -->
    <div id="contentArea">
      <!-- Public Feed renders by default -->
    </div>
  </main>
</div>

<!-- Modal Container -->
<div id="authModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h2 style="margin:0; font-weight:800;" id="modalTitle">Account Access</h2>
      <span style="cursor:pointer; font-size:20px;" onclick="closeAuthModal()">✕</span>
    </div>
    
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="setAuthMode('login')">Sign In</div>
      <div class="auth-tab" id="tabRegister" onclick="setAuthMode('register')">Register</div>
    </div>

    <input id="lEmail" placeholder="Email Address">
    <input id="lPass" type="password" placeholder="Password (Min 6 chars)">
    <button id="lBtn" class="btn btn-primary" style="width:100%; padding:12px; margin-top:8px;">Sign In</button>
  </div>
</div>

<script>
(function(){
"use strict";

var SUPABASE_URL = "https://kvgjstwgxnpendfkfkny.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2Z2pzdHdneG5wZW5kZmtma255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDU4NjMsImV4cCI6MjEwNTU4MTg2M30.SZpDrx39-ZgUzgBLEun1lhedu1ANxr06ea2ae7_84uQ";

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentProfile = null;
var authMode = 'login'; // 'login' or 'register'

async function init(){
  var sessionRes = await sb.auth.getSession();
  var session = sessionRes.data ? sessionRes.data.session : null;

  if(session){
    var profRes = await sb.from("profiles").select("*").eq("id", session.user.id).single();
    currentProfile = profRes.data;

    if(!currentProfile){
      var uname = session.user.email.split("@")[0];
      var newP = { id: session.user.id, username: uname, email: session.user.email, status: 'approved' };
      await sb.from("profiles").upsert(newP);
      currentProfile = newP;
    }
  }

  renderTopUserArea();
  renderFeed();
}

function renderTopUserArea(){
  var area = document.getElementById("userProfileArea");
  if(currentProfile){
    area.innerHTML = `
      <div class="avatar">${currentProfile.username.charAt(0).toUpperCase()}</div>
      <span style="font-size: 13px; font-weight: 700;">${currentProfile.username}</span>
      ${currentProfile.is_verified ? '<span class="badge-verified">☑️</span>' : ''}
      <button class="btn" style="background: transparent; color: var(--text-muted); padding: 4px 8px;" onclick="logout()">Logout</button>
    `;
    if(currentProfile.is_admin) document.getElementById("adminTab").style.display = "flex";
  } else {
    area.innerHTML = `
      <button class="btn btn-primary" onclick="openAuthModal('login')">Sign In</button>
      <button class="btn btn-secondary" onclick="openAuthModal('register')">Register</button>
    `;
    document.getElementById("adminTab").style.display = "none";
  }
}

function updateActiveNav(tab){
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
  var activeNav = document.getElementById('nav-' + tab) || document.getElementById(tab + 'Tab');
  if(activeNav) activeNav.classList.add('active');
}

// 1. PUBLIC SOCIAL FEED VIEW
async function renderFeed(){
  updateActiveNav('feed');
  var area = document.getElementById("contentArea");
  var postsRes = await sb.from("posts").select("*, profiles(username, is_verified, badge_level)").order("created_at", { ascending: false });
  var posts = postsRes.data || [];

  var postsHtml = posts.map(function(p){
    var vMark = (p.profiles && p.profiles.is_verified) ? "<span class='badge-verified'>☑️</span>" : "";
    var badge = (p.profiles && p.profiles.badge_level) ? "<small style='color:var(--accent); font-size:10px;'> [" + p.profiles.badge_level + "]</small>" : "";

    return `
      <div class="card post-item">
        <div class="post-header">
          <div class="post-author">
            <div class="avatar">${p.profiles ? p.profiles.username.charAt(0).toUpperCase() : 'U'}</div>
            <div>
              <strong>${p.profiles ? p.profiles.username : 'User'} ${vMark} ${badge}</strong>
              <div style="font-size:11px; color:var(--text-muted);">${new Date(p.created_at).toLocaleString()}</div>
            </div>
          </div>
        </div>
        <div style="font-size:14px; line-height:1.5; color:var(--text-title);">${p.content}</div>
        <div class="post-actions">
          <span class="action-btn" onclick="likePost('${p.id}', ${p.likes_count || 0})">❤️ ${p.likes_count || 0} Likes</span>
          <span class="action-btn">💬 ${p.comments_count || 0} Comments</span>
        </div>
      </div>
    `;
  }).join("");

  var postComposer = currentProfile ? `
    <div class="card">
      <textarea class="post-input" id="newPostContent" rows="3" placeholder="What's on your mind or payment proof?"></textarea>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <select id="postPrivacy" style="width:auto; margin:0;">
          <option value="public">🌐 Public</option>
          <option value="friends">👥 Friends Only</option>
        </select>
        <button class="btn btn-primary" onclick="submitPost()">Publish Post</button>
      </div>
    </div>
  ` : `
    <div class="card" style="text-align:center; padding:24px;">
      <h3 style="margin:0 0 8px;">Join Our Social Affiliate Network 🚀</h3>
      <p style="color:var(--text-muted); font-size:13px; margin:0 0 16px;">Connect with top affiliate marketers, share payment proofs, and earn CPA commissions.</p>
      <button class="btn btn-primary" onclick="openAuthModal('register')">Create Free Account</button>
      <button class="btn btn-secondary" onclick="openAuthModal('login')">Sign In</button>
    </div>
  `;

  area.innerHTML = `
    <div class="content-grid">
      <div>
        ${postComposer}
        <div id="postsFeed">${postsHtml || '<div class="card">No posts yet. Be the first to publish!</div>'}</div>
      </div>

      <div>
        <div class="card">
          <h4 style="margin:0 0 12px;">🌐 Platform Highlights</h4>
          <div style="font-size:13px; color:var(--text-body); margin-bottom:8px;">Active Members: <strong style="color:var(--primary);">1,200+</strong></div>
          <div style="font-size:13px; color:var(--text-body); margin-bottom:8px;">Avg Lead Rate: <strong style="color:var(--accent);">৳50 - ৳100</strong></div>
          <div style="font-size:13px; color:var(--text-body);">Payout Methods: <strong>Bkash / Nagad</strong></div>
        </div>
      </div>
    </div>
  `;
}

window.submitPost = async function(){
  if(!currentProfile){ openAuthModal('login'); return; }
  var txt = document.getElementById("newPostContent").value.trim();
  var privacy = document.getElementById("postPrivacy").value;
  if(!txt) return;

  await sb.from("posts").insert({ author_id: currentProfile.id, content: txt, privacy: privacy });
  renderFeed();
};

window.likePost = async function(postId, currentLikes){
  if(!currentProfile){ openAuthModal('login'); return; }
  await sb.from("posts").update({ likes_count: currentLikes + 1 }).eq("id", postId);
  renderFeed();
};

function requireAuth(actionName, callback){
  if(!currentProfile){ openAuthModal('login'); } else { callback(); }
}

// 2. AFFILIATE HUB
function renderAffiliate(){
  requireAuth("Affiliate Hub", function(){
    updateActiveNav('affiliate');
    var area = document.getElementById("contentArea");
    var gross = currentProfile.custom_payout || ((currentProfile.custom_conversions || 0) * (currentProfile.per_lead_rate || 50));

    area.innerHTML = `
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-label">Available Balance</div>
          <div class="metric-value" style="color:var(--accent);">৳${gross}</div>
          <button class="btn btn-primary" style="margin-top:8px;" onclick="requestWithdrawal(${gross})">Request Payout 💸</button>
        </div>
        <div class="metric-card">
          <div class="metric-label">Total Conversions</div>
          <div class="metric-value" style="color:var(--primary);">${currentProfile.custom_conversions || 0}</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Total Clicks</div>
          <div class="metric-value">${currentProfile.custom_visitors || 0}</div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 16px;">📈 Conversions Visualizer</h3>
        <canvas id="affChart" height="100"></canvas>
      </div>
    `;

    setTimeout(function(){
      var ctx = document.getElementById("affChart");
      if(ctx){
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
            datasets: [{
              label: 'Leads',
              data: [0, 1, 3, 5, currentProfile.custom_conversions || 0],
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.1)',
              fill: true
            }]
          }
        });
      }
    }, 100);
  });
}

window.requestWithdrawal = async function(amt){
  if(amt < 500){ alert("Minimum withdrawal limit is ৳500"); return; }
  var acc = prompt("Enter your Bkash / Nagad Number:");
  if(!acc) return;

  await sb.from("payouts").insert({ user_id: currentProfile.id, username: currentProfile.username, amount: amt, method: 'Bkash/Nagad', account: acc, status: 'pending' });
  alert("Payout request submitted!");
};

// 3. FRIENDS
async function renderFriends(){
  requireAuth("Friends", async function(){
    updateActiveNav('friends');
    var area = document.getElementById("contentArea");
    var usersRes = await sb.from("profiles").select("*").neq("id", currentProfile.id);
    var users = usersRes.data || [];

    var userList = users.map(function(u){
      return `
        <div class="user-row">
          <div style="display:flex; align-items:center; gap:10px;">
            <div class="avatar">${u.username.charAt(0).toUpperCase()}</div>
            <div><strong>${u.username}</strong> ${u.is_verified ? '☑️' : ''}</div>
          </div>
          <button class="btn btn-secondary" onclick="sendFriendRequest('${u.id}')">👤 + Add Friend</button>
        </div>
      `;
    }).join("");

    area.innerHTML = `
      <div class="card">
        <h3 style="margin:0 0 16px;">👥 People You May Know</h3>
        <div>${userList || 'No other users found.'}</div>
      </div>
    `;
  });
}

window.sendFriendRequest = async function(receiverId){
  await sb.from("friendships").insert({ requester_id: currentProfile.id, receiver_id: receiverId, status: 'pending' });
  alert("Friend request sent!");
};

// 4. CPA OFFERS
async function renderOffers(){
  requireAuth("CPA Offers", async function(){
    updateActiveNav('offers');
    var area = document.getElementById("contentArea");
    var offersRes = await sb.from("offers").select("*");
    var offers = offersRes.data || [
      { id: '1', name: 'Bkash App Install CPA', payout_rate: 50, url: 'https://linebd.xyz/offer1' },
      { id: '2', name: 'Nagad Promo Offer', payout_rate: 60, url: 'https://linebd.xyz/offer2' }
    ];

    var offersList = offers.map(function(o){
      var finalUrl = o.url + "?sub8=" + currentProfile.id;
      return `
        <div class="card">
          <h4 style="margin:0 0 8px; font-size:16px;">🔥 ${o.name}</h4>
          <div style="font-size:13px; color:var(--accent); margin-bottom:12px;">Payout: ৳${o.payout_rate} / Lead</div>
          <input type="text" value="${finalUrl}" readonly onclick="this.select(); document.execCommand('copy'); alert('Link copied!');">
          <small style="color:var(--text-muted);">Click input to copy tracking link</small>
        </div>
      `;
    }).join("");

    area.innerHTML = `<div>${offersList}</div>`;
  });
}

// 5. ADMIN CONTROL
async function renderAdmin(){
  if(!currentProfile || !currentProfile.is_admin) return;
  updateActiveNav('admin');
  var area = document.getElementById("contentArea");
  var payoutsRes = await sb.from("payouts").select("*").eq("status", "pending");
  var profilesRes = await sb.from("profiles").select("*");

  var payouts = payoutsRes.data || [];
  var profiles = profilesRes.data || [];

  var payoutList = payouts.map(function(p){
    return `
      <div class="user-row">
        <div><strong>${p.username}</strong> requested ৳${p.amount} (${p.account})</div>
        <button class="btn btn-primary" onclick="approvePayout('${p.id}')">✓ Approve</button>
      </div>
    `;
  }).join("");

  var userList = profiles.map(function(u){
    return `
      <div class="user-row">
        <div><strong>${u.username}</strong> ${u.is_verified ? '☑️' : ''}</div>
        <button class="btn btn-secondary" onclick="toggleVerify('${u.id}', ${!u.is_verified})">${u.is_verified ? 'Remove Badge' : 'Give Blue-Tick ☑️'}</button>
      </div>
    `;
  }).join("");

  area.innerHTML = `
    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin:0 0 16px;">💳 Pending Payout Requests</h3>
      <div>${payoutList || 'No pending payout requests.'}</div>
    </div>
    <div class="card">
      <h3 style="margin:0 0 16px;">👥 Manage Users & Blue-Ticks</h3>
      <div>${userList}</div>
    </div>
  `;
}

window.approvePayout = async function(payoutId){
  await sb.from("payouts").update({ status: 'approved' }).eq("id", payoutId);
  renderAdmin();
};

window.toggleVerify = async function(userId, status){
  await sb.from("profiles").update({ is_verified: status }).eq("id", userId);
  renderAdmin();
};

// AUTH MODAL FUNCTIONS
window.openAuthModal = function(mode){
  setAuthMode(mode || 'login');
  document.getElementById("authModal").style.display = "flex";
};

window.closeAuthModal = function(){
  document.getElementById("authModal").style.display = "none";
};

window.setAuthMode = function(mode){
  authMode = mode;
  var tabLogin = document.getElementById("tabLogin");
  var tabRegister = document.getElementById("tabRegister");
  var btn = document.getElementById("lBtn");

  if(mode === 'login'){
    tabLogin.classList.add("active");
    tabRegister.classList.remove("active");
    btn.textContent = "Sign In";
  } else {
    tabRegister.classList.add("active");
    tabLogin.classList.remove("active");
    btn.textContent = "Create Account";
  }
};

document.getElementById("lBtn").onclick = async function(){
  var e = document.getElementById("lEmail").value.trim();
  var p = document.getElementById("lPass").value;

  if(!e || !p){ alert("Please enter email and password."); return; }

  if(authMode === 'login'){
    var res = await sb.auth.signInWithPassword({ email: e, password: p });
    if(res.error) alert("Invalid login credentials.");
    else location.reload();
  } else {
    var signUpRes = await sb.auth.signUp({ email: e, password: p });
    if(signUpRes.error) alert(signUpRes.error.message);
    else {
      alert("Registration successful! Logging in...");
      location.reload();
    }
  }
};

window.logout = async function(){
  await sb.auth.signOut();
  location.reload();
};

// TAB SWITCHER
window.switchTab = function(tab){
  if(tab === 'feed') renderFeed();
  else if(tab === 'affiliate') renderAffiliate();
  else if(tab === 'friends') renderFriends();
  else if(tab === 'offers') renderOffers();
  else if(tab === 'admin') renderAdmin();
};

init();
})();
</script>
</body>
</html>
