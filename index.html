<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LinkFlow Social & CPA Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>

<style>
  :root {
    --bg-main: #0b0f19;
    --card-bg: #151c2c;
    --card-border: rgba(255, 255, 255, 0.08);
    --primary: #10b981;
    --primary-glow: rgba(16, 185, 129, 0.15);
    --accent: #f59e0b;
    --verified: #3b82f6;
    --danger: #ef4444;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --nav-height: 65px;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; background: var(--bg-main); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

  /* Header */
  .mobile-header { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: rgba(21, 28, 44, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100; }
  .brand-logo { font-weight: 800; font-size: 18px; color: var(--primary); display: flex; align-items: center; gap: 8px; cursor: pointer; }

  .header-actions { display: flex; align-items: center; gap: 12px; }
  .icon-btn { position: relative; background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-main); font-size: 16px; cursor: pointer; }
  .badge-count { position: absolute; top: -2px; right: -2px; background: var(--danger); color: #fff; font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 10px; }

  /* App Body Canvas */
  .app-body { margin-top: 56px; margin-bottom: calc(var(--nav-height) + 15px); padding: 16px; max-width: 600px; margin-left: auto; margin-right: auto; }

  /* Search & Hashtags */
  .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
  .hashtag-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
  .hashtag-chips::-webkit-scrollbar { display: none; }
  .chip { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 600; color: var(--text-sub); white-space: nowrap; cursor: pointer; }
  .chip.active { background: var(--primary-glow); color: var(--primary); border-color: var(--primary); }

  /* Pinned Notice */
  .pinned-notice { background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(59, 130, 246, 0.15)); border: 1px solid var(--primary); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 12px; }

  /* Bottom Navigation */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height); background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(16px); border-top: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-around; z-index: 100; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-sub); font-size: 10.5px; font-weight: 700; gap: 3px; cursor: pointer; border: none; background: transparent; flex: 1; position: relative; }
  .nav-btn.active { color: var(--primary); }
  .nav-btn span { font-size: 19px; }

  /* Cards & Post Feed */
  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; margin-bottom: 16px; backdrop-filter: blur(8px); }
  .post-author { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .author-info { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #000; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }

  .badge-tag { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: rgba(245, 158, 11, 0.15); color: var(--accent); border: 1px solid rgba(245, 158, 11, 0.3); margin-left: 4px; }

  .post-media { width: 100%; border-radius: 12px; margin-top: 10px; max-height: 350px; object-fit: cover; border: 1px solid var(--card-border); }

  .post-actions { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--card-border); margin-top: 12px; padding-top: 10px; font-size: 12.5px; color: var(--text-sub); }
  .action-btn { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .action-btn:hover { color: var(--primary); }

  /* Comment Section */
  .comments-box { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--card-border); }
  .comment-item { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px; }

  /* Metrics Grid */
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .metric-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; }
  .metric-label { font-size: 11px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; }
  .metric-val { font-size: 20px; font-weight: 800; font-family: var(--font-mono); margin-top: 4px; }

  /* Inputs & Pill Buttons */
  input, textarea, select { width: 100%; background: var(--bg-main); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; color: #fff; font-family: inherit; margin-bottom: 10px; font-size: 14px; }
  .btn-pill { width: 100%; border-radius: 25px; padding: 12px; border: none; font-weight: 800; font-size: 14px; cursor: pointer; background: var(--primary); color: #000; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-secondary { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--card-border); }

  /* Slide-Up Bottom Drawer Sheet */
  .bottom-sheet { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: flex-end; z-index: 200; backdrop-filter: blur(4px); }
  .sheet-content { background: var(--card-bg); border-radius: 24px 24px 0 0; padding: 24px; width: 100%; max-height: 85vh; overflow-y: auto; border-top: 1px solid var(--card-border); }
  
  .auth-tabs { display: flex; border-bottom: 1px solid var(--card-border); margin-bottom: 16px; }
  .auth-tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; font-weight: 700; color: var(--text-sub); }
  .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

  /* Profile Cover Drawer */
  .profile-header-card { position: relative; border-radius: 18px; overflow: hidden; background: var(--card-bg); border: 1px solid var(--card-border); margin-bottom: 16px; }
  .cover-photo { width: 100%; height: 110px; background: linear-gradient(135deg, #059669, #3b82f6); object-fit: cover; }
  .profile-details { padding: 0 16px 16px; margin-top: -30px; }
</style>
</head>
<body>

<!-- Mobile Header Bar -->
<div class="mobile-header">
  <div class="brand-logo" onclick="switchTab('feed')">⚡ LinkFlow</div>
  <div class="header-actions">

<!-- Notifications Drawer Modal -->

      <div class="card" style="margin-bottom:8px;"><strong>Rahat_IT</strong> আপনার ফ্রেন্ড রিকোয়েস্ট একসেপ্ট করেছেন। <small style="color:var(--text-sub); display:block;">১০ মিনিট আগে</small></div>

<!-- Main App Body Canvas -->
<div class="app-body" id="appBody"></div>

<!-- Floating Messenger Chat -->
<div id="messengerModal" class="bottom-sheet" style="display:none;">
  <div class="sheet-content" style="height:70vh;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid var(--card-border); padding-bottom:8px;">
      <h4 style="margin:0; font-weight:800;" id="chatTitle">💬 ডাইরেক্ট চ্যাট</h4>

      <input id="chatInput" placeholder="মেসেজ লিখুন..." style="margin-bottom:0;">
      <button class="btn-pill" style="width:auto; padding:0 20px;" onclick="sendChatMessage()">পাঠান</button>

<!-- App Bottom Navigation Bar -->
<div class="bottom-nav">
  <button class="nav-btn active" id="btn-feed" onclick="switchTab('feed')">
    <span>🏠</span> ফিড
  </button>
  <button class="nav-btn" id="btn-offers" onclick="switchTab('offers')">
    <span>🔥</span> অফার
  </button>
  <button class="nav-btn" id="btn-affiliate" onclick="switchTab('affiliate')">
    <span>📊</span> এনালিটিক্স
  </button>
  <button class="nav-btn" id="btn-friends" onclick="switchTab('friends')">

  <button class="nav-btn" id="btn-profile" onclick="switchTab('profile')">

  <button class="nav-btn" id="btn-admin" style="display:none;" onclick="switchTab('admin')">
    <span>⚙️</span> কন্ট্রোল

</div>

<!-- Mobile Auth Slide-Up Bottom Sheet -->
<div id="authSheet" class="bottom-sheet" style="display:none;">
  <div class="sheet-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 style="margin:0; font-weight:800;" id="sheetTitle">একাউন্ট অ্যাক্সেস</h3>
      <span style="cursor:pointer; font-size:20px;" onclick="closeAuthSheet()">✕</span>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="setAuthMode('login')">সাইন ইন</div>

    <input id="lEmail" placeholder="ইমেইল অ্যাড্রেস">
    <input id="lPass" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)">
    <button class="btn-pill" id="sheetSubmitBtn" onclick="handleAuth()">লগইন করুন</button>
  </div>
</div>

<script>
(function(){
"use strict";

var SUPABASE_URL = "https://kvgjstwgxnpendfkfkny.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2Z2pzdHdneG5wZW5kZmtma255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDU4NjMsImV4cCI6MjEwNTU4MTg2M30.SZpDrx39-ZgUzgBLEun1lhedu1ANxr06ea2ae7_84uQ";

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentProfile = null;
var authMode = 'login';
var activeHashtag = '';

async function init(){
  var sessionRes = await sb.auth.getSession();
  var session = sessionRes.data ? sessionRes.data.session : null;

  if(session){
    var profRes = await sb.from("profiles").select("*").eq("id", session.user.id).single();
    currentProfile = profRes.data;

    if(!currentProfile){
      var uname = session.user.email.split("@")[0];
      var newP = { id: session.user.id, username: uname, email: session.user.email, status: 'approved', badge_level: 'Bronze' };
      await sb.from("profiles").upsert(newP);
      currentProfile = newP;
    }
  }

  renderTopHeader();
  renderFeed();
}

function renderTopHeader(){
  var area = document.getElementById("topUserArea");
  if(currentProfile){
    area.innerHTML = `
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="avatar" style="width:32px; height:32px; font-size:12px;">${currentProfile.username.charAt(0).toUpperCase()}</div>
      </div>
    `;
    if(currentProfile.is_admin) document.getElementById("btn-admin").style.display = "flex";
  } else {
    area.innerHTML = `<button onclick="openAuthSheet('login')" style="background:var(--primary); border:none; padding:6px 14px; border-radius:20px; font-weight:800; font-size:12px;">সাইন ইন</button>`;
  }
}

function setActiveNav(tab){
  document.querySelectorAll('.nav-btn').forEach(function(el){ el.classList.remove('active'); });
  var activeBtn = document.getElementById('btn-' + tab);
  if(activeBtn) activeBtn.classList.add('active');
}

// 1. MOBILE FEED VIEW WITH HASHTAGS & MEDIA
async function renderFeed(){
  setActiveNav('feed');
  var area = document.getElementById("appBody");
  var query = sb.from("posts").select("*, profiles(username, is_verified, badge_level)").order("created_at", { ascending: false });
  
  var postsRes = await query;
  var posts = postsRes.data || [];

  if(activeHashtag){
    posts = posts.filter(p => p.content.includes(activeHashtag));
  }

  var pinnedNotice = `
    <div class="pinned-notice">
      <div style="font-size:20px;">📌</div>
      <div style="flex:1;">
        <strong style="color:var(--primary); font-size:13px;">অফিশিয়াল পিন্ড নোটিশ</strong>
        <p style="margin:4px 0 0; font-size:12px; color:var(--text-main); line-height:1.4;">সকল নতুন প্রমোটারদের জন্য Meta Ads এবং Facebook CPA ট্রাফিক টিপস গাইড আনলক করা হয়েছে!</p>
      </div>
    </div>
  `;

  var hashtagsHtml = `
    <div class="hashtag-chips">
      <div class="chip ${activeHashtag===''?'active':''}" onclick="filterHashtag('')">🔥 All Posts</div>
      <div class="chip ${activeHashtag==='#MetaAds'?'active':''}" onclick="filterHashtag('#MetaAds')">#MetaAds</div>
      <div class="chip ${activeHashtag==='#CPAMarketing'?'active':''}" onclick="filterHashtag('#CPAMarketing')">#CPAMarketing</div>
      <div class="chip ${activeHashtag==='#Smartlink'?'active':''}" onclick="filterHashtag('#Smartlink')">#Smartlink</div>
      <div class="chip ${activeHashtag==='#Tips'?'active':''}" onclick="filterHashtag('#Tips')">#Tips</div>
    </div>
  `;

  var postsHtml = posts.map(function(p){
    var vMark = (p.profiles && p.profiles.is_verified) ? "<span style='color:var(--verified);'>☑️</span>" : "";
    var badge = (p.profiles && p.profiles.badge_level) ? `<span class="badge-tag">${p.profiles.badge_level}</span>` : "";
    var views = p.views_count || Math.floor(Math.random() * 80) + 14;
    var likes = p.likes_count || 0;
    var isOwner = currentProfile && currentProfile.id === p.author_id;

    var mediaHtml = p.image_url ? `<img src="${p.image_url}" class="post-media" alt="post attachment">` : '';

    return `
      <div class="card" id="post-${p.id}">
        <div class="post-author">
          <div class="author-info">
            <div class="avatar">${p.profiles ? p.profiles.username.charAt(0).toUpperCase() : 'U'}</div>
            <div>
              <strong>${p.profiles ? p.profiles.username : 'ইউজার'} ${vMark} ${badge}</strong>
              <div style="font-size:11px; color:var(--text-sub);">${new Date(p.created_at).toLocaleString()}</div>
            </div>
          </div>
          ${isOwner ? `<button onclick="editPost('${p.id}', '${escape(p.content)}')" style="background:transparent; border:none; color:var(--text-sub); font-size:12px; cursor:pointer;">✏️ Edit</button>` : ''}
        </div>

        <div style="font-size:14px; line-height:1.5; color:var(--text-main);" id="post-text-${p.id}">${p.content}</div>
        ${mediaHtml}

        <div class="post-actions">
          <span class="action-btn" onclick="likePost('${p.id}', ${likes})">❤️ ${likes} Likes</span>
          <span class="action-btn" onclick="toggleComments('${p.id}')">💬 Comments</span>
          <span class="action-btn" style="cursor:default; color:var(--primary);">👁️ ${views} Views</span>
        </div>

        <div id="comments-${p.id}" class="comments-box" style="display:none;">
          <div id="comment-list-${p.id}">
            <div class="comment-item"><strong>Tanvir:</strong> গ্রেট টিপস ভাই! 🚀</div>
          </div>
          <div style="display:flex; gap:6px; margin-top:8px;">
            <input id="comment-input-${p.id}" placeholder="কমেন্ট লিখুন..." style="margin-bottom:0; font-size:12px; padding:8px 12px;">
            <button class="btn-pill" style="width:auto; padding:0 14px; font-size:12px;" onclick="addComment('${p.id}')">পাঠান</button>
          </div>
        </div>
      </div>
    `;
  }).join("");

  var composer = currentProfile ? `
    <div class="card">
      <textarea id="postTxt" rows="2" placeholder="নতুন কিছু, ছবি লিংক বা হ্যাশট্যাগ (#MetaAds) পোস্ট করুন..."></textarea>
      <input id="postImgUrl" placeholder="ছবি URL (অপশনাল, e.g. https://...)" style="font-size:12px;">
      <button class="btn-pill" onclick="publishPost()">পোস্ট করুন 🚀</button>
    </div>
  ` : `
    <div class="card" style="text-align:center; padding:20px;">
      <h3 style="margin:0 0 8px;">কমিউনিটিতে যোগ দিন 🚀</h3>
      <p style="color:var(--text-sub); font-size:13px; margin:0 0 14px;">পোস্ট করতে এবং অফার প্রমোট করতে সাইন ইন করুন।</p>
      <button class="btn-pill" onclick="openAuthSheet('register')">একাউন্ট খুলুন</button>
    </div>
  `;

  area.innerHTML = pinnedNotice + hashtagsHtml + composer + `<div>${postsHtml || '<div class="card">কোনো পোস্ট পাওয়া যায়নি।</div>'}</div>`;
}

window.filterHashtag = function(tag){
  activeHashtag = tag;
  renderFeed();
};

window.publishPost = async function(){
  var txt = document.getElementById("postTxt").value.trim();
  var img = document.getElementById("postImgUrl").value.trim();
  if(!txt) return;
  await sb.from("posts").insert({ author_id: currentProfile.id, content: txt, image_url: img, views_count: 1 });
  renderFeed();
};

window.editPost = async function(postId, rawTxt){
  var oldTxt = unescape(rawTxt);
  var newTxt = prompt("পোস্ট এডিট করুন:", oldTxt);
  if(newTxt && newTxt !== oldTxt){
    await sb.from("posts").update({ content: newTxt }).eq("id", postId);
    renderFeed();
  }
};

window.likePost = async function(postId, currentLikes){
  if(!currentProfile){ openAuthSheet('login'); return; }
  await sb.from("posts").update({ likes_count: currentLikes + 1 }).eq("id", postId);
  renderFeed();
};

window.toggleComments = function(postId){
  var el = document.getElementById("comments-" + postId);
  el.style.display = el.style.display === "none" ? "block" : "none";
};

window.addComment = function(postId){
  var inp = document.getElementById("comment-input-" + postId);
  var txt = inp.value.trim();
  if(!txt) return;

  var list = document.getElementById("comment-list-" + postId);
  var newC = document.createElement("div");
  newC.className = "comment-item";
  newC.innerHTML = `<strong>${currentProfile ? currentProfile.username : 'You'}:</strong> ${txt}`;
  list.appendChild(newC);
  inp.value = "";
};

// 2. CPA OFFERS VIEW (1-Click Share to Feed)
async function renderOffers(){
  requireAuth(async function(){
    setActiveNav('offers');
    var area = document.getElementById("appBody");
    var offersRes = await sb.from("offers").select("*");
    var offers = offersRes.data || [
      { id: '1', name: 'Bkash App Install CPA', category: 'App Install', url: 'https://linebd.xyz/offer1' },
      { id: '2', name: 'Nagad Promo Offer', category: 'Smartlink', url: 'https://linebd.xyz/offer2' }
    ];

    var offersHtml = offers.map(function(o){
      var trackingUrl = o.url + "?sub8=" + currentProfile.id;
      return `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <h4 style="margin:0;">🔥 ${o.name}</h4>
            <span class="badge-tag">${o.category || 'CPA'}</span>
          </div>
          <input type="text" value="${trackingUrl}" readonly onclick="this.select(); document.execCommand('copy'); alert('ট্র্যাকিং লিংক কপি হয়েছে!');">
          <button class="btn-pill btn-secondary" onclick="shareOfferToFeed('${o.name}', '${trackingUrl}')">🚀 ফিডে প্রমোট করুন</button>
        </div>
      `;
    }).join("");

    area.innerHTML = `<div>${offersHtml}</div>`;
  });
}

window.shareOfferToFeed = async function(offerName, link){
  var content = "🔥 " + offerName + " প্রমোট শুরু করুন!\n#CPAMarketing লিংক: " + link;
  await sb.from("posts").insert({ author_id: currentProfile.id, content: content, views_count: 1 });
  alert("অফারটি আপনার সোশ্যাল ফিডে পোস্ট করা হয়েছে!");
  renderFeed();
};

// 3. AFFILIATE DASHBOARD & SMART SHORTENER
function renderAffiliate(){
  requireAuth(function(){
    setActiveNav('affiliate');
    var area = document.getElementById("appBody");
    var gross = currentProfile.custom_payout || ((currentProfile.custom_conversions || 0) * (currentProfile.per_lead_rate || 50));

    area.innerHTML = `
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-label">মোট কনভার্সন</div>
          <div class="metric-val" style="color:var(--primary);">${currentProfile.custom_conversions || 0}</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">ট্রাফিক ক্লিকস</div>
          <div class="metric-val" style="color:var(--accent);">${currentProfile.custom_visitors || 124}</div>
        </div>
      </div>

      <div class="card">
        <h4 style="margin:0 0 10px;">🔗 স্মার্ট ইউআরএল শর্টনার</h4>
        <input id="longUrl" placeholder="দীর্ঘ CPA লিংক এখানে পেস্ট করুন...">
        <button class="btn-pill" onclick="shortenUrl()">কাস্টম লিংক তৈরি করুন</button>
        <div id="shortResult" style="margin-top:10px; font-weight:700; color:var(--primary);"></div>
      </div>

      <div class="card">
        <h4 style="margin:0 0 12px;">📈 জিও ও ডিভাইস ট্র্যাকার</h4>
        <canvas id="affChart" height="120"></canvas>
      </div>
    `;

    setTimeout(function(){
      var ctx = document.getElementById("affChart");
      if(ctx){
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: ['Bangladesh', 'USA', 'UK', 'India', 'Others'],
            datasets: [{ label: 'Traffic Clicks', data: [85, 20, 10, 5, 4], borderColor: '#10b981', fill: false }]
          }
        });
      }
    }, 100);
  });
}

window.shortenUrl = function(){
  var url = document.getElementById("longUrl").value.trim();
  if(!url) return;
  var short = "https://linebd.xyz/s/" + Math.random().toString(36).substring(7);
  document.getElementById("shortResult").innerHTML = `শর্ট লিংক: <input value="${short}" readonly onclick="this.select();">`;
};

// 4. FRIENDS & MESSENGER
async function renderFriends(){
  requireAuth(async function(){
    setActiveNav('friends');
    var area = document.getElementById("appBody");
    var usersRes = await sb.from("profiles").select("*").neq("id", currentProfile.id);
    var users = usersRes.data || [];

    var userList = users.map(function(u){
      return `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <div style="display:flex; align-items:center; gap:10px;">
            <div class="avatar">${u.username.charAt(0).toUpperCase()}</div>
            <div>
              <strong>${u.username}</strong> ${u.is_verified ? '☑️' : ''}
              <div style="font-size:11px; color:var(--accent);">${u.badge_level || 'Bronze Member'}</div>
            </div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn-pill" style="width:auto; padding:6px 12px; font-size:12px;" onclick="openMessenger('${u.username}')">💬 ইনবক্স</button>
          </div>
        </div>
      `;
    }).join("");

    area.innerHTML = `<div><h3 style="margin:0 0 12px;">👥 নেটওয়ার্ক মেম্বার্স</h3>${userList || '<div class="card">কোনো ইউজার নেই।</div>'}</div>`;
  });
}

// 5. USER PROFILE DRAWER
function renderProfile(){
  requireAuth(function(){
    setActiveNav('profile');
    var area = document.getElementById("appBody");

    area.innerHTML = `
      <div class="profile-header-card">
        <div class="cover-photo"></div>
        <div class="profile-details">
          <div class="avatar" style="width:60px; height:60px; font-size:24px; border:3px solid var(--card-bg);">${currentProfile.username.charAt(0).toUpperCase()}</div>
          <h3 style="margin:8px 0 2px;">${currentProfile.username} ${currentProfile.is_verified ? '☑️' : ''}</h3>
          <span class="badge-tag">${currentProfile.badge_level || 'Bronze Marketer'}</span>
          <p style="font-size:13px; color:var(--text-sub); margin:8px 0;">${currentProfile.bio || 'CPA Marketing Enthusiast & Traffic Specialist'}</p>
          <button class="btn-pill btn-secondary" onclick="logout()">লগআউট করুন 🚪</button>
        </div>
      </div>
    `;
  });
}

// 6. ADMIN CONTROL VIEW
async function renderAdmin(){
  if(!currentProfile || !currentProfile.is_admin) return;
  setActiveNav('admin');
  var area = document.getElementById("appBody");
  var profilesRes = await sb.from("profiles").select("*");
  var profiles = profilesRes.data || [];

  var userList = profiles.map(function(u){
    return `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div><strong>${u.username}</strong> ${u.is_verified ? '☑️' : ''}</div>
        <button class="btn-pill" style="width:auto; padding:6px 12px;" onclick="toggleVerify('${u.id}', ${!u.is_verified})">${u.is_verified ? 'ব্যাজ রিমুভ' : 'ব্লু-টিক দিন ☑️'}</button>
      </div>
    `;
  }).join("");

  area.innerHTML = `<div><h3 style="margin:0 0 12px;">👥 ইউজার ও ব্লু-টিক কন্ট্রোল</h3>${userList}</div>`;
}

window.toggleVerify = async function(userId, status){
  await sb.from("profiles").update({ is_verified: status }).eq("id", userId);
  renderAdmin();
};

// MESSENGER LOGIC
window.openMessenger = function(username){
  document.getElementById("chatTitle").textContent = "💬 Chat with " + username;
  document.getElementById("chatHistory").innerHTML = `
    <div style="background:rgba(255,255,255,0.05); padding:8px 12px; border-radius:10px; margin-bottom:8px; font-size:13px;"><strong>${username}:</strong> হ্যালো! নতুন কোনো CPA ট্রিকস আছে?</div>
  `;
  document.getElementById("messengerModal").style.display = "flex";
};

window.closeMessenger = function(){
  document.getElementById("messengerModal").style.display = "none";
};

window.sendChatMessage = function(){
  var txt = document.getElementById("chatInput").value.trim();
  if(!txt) return;
  var hist = document.getElementById("chatHistory");
  var msg = document.createElement("div");
  msg.style.cssText = "background:var(--primary-glow); color:var(--primary); padding:8px 12px; border-radius:10px; margin-bottom:8px; font-size:13px; text-align:right;";
  msg.innerHTML = `<strong>You:</strong> ${txt}`;
  hist.appendChild(msg);
  document.getElementById("chatInput").value = "";
};

// NOTIFICATIONS LOGIC
window.toggleNotifications = function(){
  var drawer = document.getElementById("notifDrawer");
  drawer.style.display = drawer.style.display === "none" ? "flex" : "none";
  document.getElementById("notifBadge").style.display = "none";
};

// AUTHENTICATION MODAL
function requireAuth(cb){
  if(!currentProfile) openAuthSheet('login');
  else cb();
}

window.openAuthSheet = function(mode){
  setAuthMode(mode || 'login');
  document.getElementById("authSheet").style.display = "flex";
};

window.closeAuthSheet = function(){
  document.getElementById("authSheet").style.display = "none";
};

window.setAuthMode = function(mode){
  authMode = mode;
  var tabL = document.getElementById("tabLogin");
  var tabR = document.getElementById("tabRegister");
  var btn = document.getElementById("sheetSubmitBtn");

  if(mode === 'login'){
    tabL.classList.add("active");
    tabR.classList.remove("active");
    btn.textContent = "লগইন করুন";
  } else {
    tabR.classList.add("active");
    tabL.classList.remove("active");
    btn.textContent = "নতুন একাউন্ট খুলুন";
  }
};

window.handleAuth = async function(){
  var e = document.getElementById("lEmail").value.trim();
  var p = document.getElementById("lPass").value;

  if(!e || !p){ alert("ইমেইল ও পাসওয়ার্ড দিন!"); return; }

  if(authMode === 'login'){
    var res = await sb.auth.signInWithPassword({ email: e, password: p });
    if(res.error) alert("ভুল ইমেইল বা পাসওয়ার্ড!");
    else location.reload();
  } else {
    var signUp = await sb.auth.signUp({ email: e, password: p });
    if(signUp.error) alert(signUp.error.message);
    else { alert("একাউন্ট তৈরি হয়েছে!"); location.reload(); }
  }
};

window.logout = async function(){
  await sb.auth.signOut();
  location.reload();
};

window.switchTab = function(tab){
  if(tab === 'feed') renderFeed();
  else if(tab === 'offers') renderOffers();
  else if(tab === 'affiliate') renderAffiliate();
  else if(tab === 'friends') renderFriends();
  else if(tab === 'profile') renderProfile();
  else if(tab === 'admin') renderAdmin();
};

init();
})();
</script>
</body>
</html>
