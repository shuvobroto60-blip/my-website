<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LinkFlow Network Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg-dark: #07090e;
    --card-bg: rgba(18, 25, 38, 0.75);
    --card-solid: #0f172a;
    --surface: #1e293b;
    --border: rgba(255, 255, 255, 0.08);
    --border-bright: rgba(255, 255, 255, 0.18);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-gold: #f59e0b;
    --accent-green: #10b981;
    --accent-purple: #8b5cf6;
    --accent-red: #ef4444;
    --gradient-gold: linear-gradient(135deg, #f59e0b, #d97706);
    --gradient-green: linear-gradient(135deg, #10b981, #059669);
    --font-sans: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg-dark); color: var(--text-primary); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font-family: inherit; }

  header {
    position: sticky; top: 0; z-index: 50; backdrop-filter: blur(16px);
    background: rgba(7, 9, 14, 0.85); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; color: #fff; letter-spacing: -0.5px; }
  .brand-logo { width: 34px; height: 34px; border-radius: 10px; background: var(--gradient-gold); display: flex; align-items: center; justify-content: center; color: #000; font-weight: 900; }
  .logout-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .logout-btn:hover { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }

  main { max-width: 1000px; margin: 0 auto; padding: 16px 14px 100px; }
  .center-wrap { max-width: 400px; margin: 30px auto; }

  .card { border: 1px solid var(--border); border-radius: 18px; background: var(--card-bg); backdrop-filter: blur(12px); padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); margin-bottom: 16px; }

  .hero-balance {
    background: radial-gradient(130% 140% at 0% 0%, rgba(245, 158, 11, 0.15), transparent 70%), var(--card-solid);
    border: 1px solid var(--border-bright); border-radius: 20px; padding: 22px; position: relative; overflow: hidden; margin-bottom: 16px;
  }
  .hero-title { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin: 0 0 4px; }
  .hero-amount { font-family: var(--font-mono); font-size: 38px; font-weight: 800; color: var(--accent-gold); margin: 0 0 14px; }

  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  @media(min-width: 640px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat-card { background: var(--card-solid); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .stat-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 600; }
  .stat-val { font-family: var(--font-mono); font-size: 19px; font-weight: 700; color: #fff; }

  .btn-primary { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--gradient-gold); color: #000; font-weight: 800; font-size: 14px; cursor: pointer; transition: transform 0.1s; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-sm { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn-success { background: var(--accent-green); color: #000; border: none; }

  .offer-item { background: var(--card-solid); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; position: relative; }
  .tag-hot { position: absolute; top: 14px; right: 14px; background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 20px; }

  .link-input-group { display: flex; gap: 8px; margin-top: 12px; }
  .link-input-group input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: #fff; font-size: 13px; }

  .copy-box { margin-top: 10px; padding: 12px; border-radius: 10px; background: rgba(16, 185, 129, 0.08); border: 1px dashed var(--accent-green); font-family: var(--font-mono); font-size: 12px; color: var(--accent-green); cursor: pointer; display: none; word-break: break-all; }
  .copy-box.active { display: block; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px);
    border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  }
  .nav-tab { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-secondary); font-size: 10px; font-weight: 700; border: none; background: transparent; cursor: pointer; flex: 1; }
  .nav-tab.active { color: var(--accent-gold); }
  .nav-tab span { font-size: 18px; }

  .badge { padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; display: inline-block; }
  .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); }
  .badge-approved { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-body { background: var(--card-solid); border: 1px solid var(--border-bright); border-radius: 20px; width: 100%; max-width: 440px; padding: 22px; }

  .rank-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border); }
  .rank-num { font-weight: 800; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); color: #fff; font-size: 12px; }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="brand-logo">⚡</div>LinkFlow</div>
  <button class="logout-btn" id="logoutBtn" style="display:none;">Sign Out</button>
</header>

<main id="app"><div style="text-align:center; padding:50px; color:var(--text-secondary);">Loading Portal…</div></main>

<nav class="bottom-nav" id="bottomNav" style="display:none;">
  <button class="nav-tab active" data-tab="dashboard"><span>📊</span>Home</button>
  <button class="nav-tab" data-tab="offers"><span>🔥</span>Offers</button>
  <button class="nav-tab" data-tab="ranks"><span>🏆</span>Ranks</button>
  <button class="nav-tab" data-tab="wallet"><span>💸</span>Wallet</button>
</nav>

<div id="modalContainer"></div>

<script>
(function(){
"use strict";

var SUPABASE_URL = "https://kvgjstwgxnpendfkfkny.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2Z2pzdHdneG5wZW5kZmtma255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDU4NjMsImV4cCI6MjEwNTU4MTg2M30.SZpDrx39-ZgUzgBLEun1lhedu1ANxr06ea2ae7_84uQ";
var MIN_WITHDRAW = 500;

var sb = null;
try {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(e) {
  console.error("Supabase Error:", e);
}

var app = document.getElementById("app");
var logoutBtn = document.getElementById("logoutBtn");
var bottomNav = document.getElementById("bottomNav");

var currentProfile = null;
var activeViewTab = "dashboard";

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

logoutBtn.addEventListener("click", async function(){
  if (sb) await sb.auth.signOut();
  window.location.reload();
});

async function init(){
  if (!sb) {
    app.innerHTML = "<div style='text-align:center; padding:50px; color:var(--accent-red);'>Connection Error. Please refresh.</div>";
    return;
  }

  try {
    var sessionRes = await sb.auth.getSession();
    var session = sessionRes.data ? sessionRes.data.session : null;

    if (!session){
      logoutBtn.style.display = "none";
      bottomNav.style.display = "none";
      renderAuth();
      return;
    }

    logoutBtn.style.display = "block";
    var user = session.user;
    var profRes = await sb.from("profiles").select("*").eq("id", user.id).single();

    if (!profRes.data){
      var uname = user.email.split("@")[0];
      var newP = { id: user.id, username: uname, email: user.email, status: "pending", per_lead_rate: 0 };
      await sb.from("profiles").upsert(newP);
      currentProfile = newP;
    } else {
      currentProfile = profRes.data;
    }

    if (currentProfile.is_admin){
      renderAdmin();
    } else {
      bottomNav.style.display = "flex";
      setupNavListeners();
      renderUserView();
    }
  } catch(err) {
    console.error(err);
    app.innerHTML = "<div style='text-align:center; padding:50px; color:var(--accent-red);'>Unable to load portal. Refreshing...</div>";
  }
}

function renderAuth(){
  app.innerHTML =
    "<div class='center-wrap'>" +
      "<div class='card'>" +
        "<h2 style='margin:0 0 6px; font-weight:800; color:#fff;'>LinkFlow Portal</h2>" +
        "<p style='margin:0 0 20px; font-size:12.5px; color:var(--text-secondary);'>Sign in to manage your affiliate campaigns</p>" +
        "<label style='font-size:11px; color:var(--text-secondary);'>Email Address</label>" +
        "<input id='lEmail' type='email' style='width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-dark); color:#fff; margin:4px 0 12px;'>" +
        "<label style='font-size:11px; color:var(--text-secondary);'>Password</label>" +
        "<input id='lPass' type='password' style='width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-dark); color:#fff; margin:4px 0 16px;'>" +
        "<button class='btn-primary' id='lBtn'>Sign In</button>" +
      "</div>" +
    "</div>";

  document.getElementById("lBtn").onclick = async function(){
    var e = document.getElementById("lEmail").value.trim();
    var p = document.getElementById("lPass").value;
    if (!e || !p) return alert("Fill all fields");
    var res = await sb.auth.signInWithPassword({ email: e, password: p });
    if (res.error) alert("Invalid Email or Password");
    else init();
  };
}

function setupNavListeners(){
  document.querySelectorAll(".nav-tab").forEach(function(btn){
    btn.onclick = function(){
      document.querySelectorAll(".nav-tab").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      activeViewTab = btn.getAttribute("data-tab");
      renderUserView();
    };
  });
}

async function renderUserView(){
  var payoutsRes = await sb.from("payouts").select("*").eq("user_id", currentProfile.id);
  var offersRes = await sb.from("offers").select("*");
  var allUsersRes = await sb.from("profiles").select("*").order("custom_conversions", { ascending: false }).limit(10);

  var payouts = payoutsRes.data || [];
  var offers = offersRes.data || [];
  var topUsers = allUsersRes.data || [];

  var leadRate = currentProfile.per_lead_rate || 0;
  var gross = currentProfile.custom_payout || ((currentProfile.custom_conversions || 0) * leadRate);

  var requestedOrPaid = 0, paidTotal = 0;
  payouts.forEach(function(p){
    if (p.status === "pending" || p.status === "approved") requestedOrPaid += parseFloat(p.amount) || 0;
    if (p.status === "approved") paidTotal += parseFloat(p.amount) || 0;
  });

  var availBalance = Math.max(0, gross - requestedOrPaid);

  if (activeViewTab === "dashboard") {
    app.innerHTML =
      "<div class='hero-balance'>" +
        "<div class='hero-title'>Available Balance</div>" +
        "<div class='hero-amount'>৳" + availBalance + "</div>" +
        "<button class='btn-primary' id='quickWithdrawBtn' style='width:auto; padding:8px 18px;'>Request Payout 💸</button>" +
      "</div>" +

      "<div class='stats-grid'>" +
        "<div class='stat-card'><div class='stat-label'>Clicks</div><div class='stat-val'>" + (currentProfile.custom_visitors || 0) + "</div></div>" +
        "<div class='stat-card'><div class='stat-label'>Leads</div><div class='stat-val' style='color:var(--accent-green);'>" + (currentProfile.custom_conversions || 0) + "</div></div>" +
        "<div class='stat-card'><div class='stat-label'>Rate</div><div class='stat-val' style='color:var(--accent-gold);'>৳" + leadRate + "</div></div>" +
        "<div class='stat-card'><div class='stat-label'>Total Paid</div><div class='stat-val' style='color:var(--accent-green);'>৳" + paidTotal + "</div></div>" +
      "</div>";

    document.getElementById("quickWithdrawBtn").onclick = function(){ openWithdrawModal(availBalance); };

  } else if (activeViewTab === "offers") {
    app.innerHTML = "<h3 style='color:#fff; margin:0 0 14px;'>Available Offers</h3>" +
      offers.map(function(o){
        return (
          "<div class='offer-item'>" +
            "<span class='tag-hot'>HOT OFFER</span>" +
            "<div style='font-weight:700; color:#fff; font-size:15px;'>" + esc(o.name) + "</div>" +
            "<div class='link-input-group'>" +
              "<input type='text' id='sub-" + o.id + "' placeholder='Enter Sub ID / Name'>" +
              "<button class='btn-sm btn-success' data-gen='" + o.id + "'>Get Link</button>" +
            "</div>" +
            "<div class='copy-box' id='box-" + o.id + "'></div>" +
          "</div>"
        );
      }).join("");

    offers.forEach(function(o){
      var btn = document.querySelector("[data-gen='" + o.id + "']");
      if (btn){
        btn.onclick = function(){
          var sub = document.getElementById("sub-" + o.id).value.trim();
          if (!sub) return alert("Enter Sub ID first");
          var finalUrl = o.url + (o.url.includes("?") ? "&" : "?") + "sub8=" + encodeURIComponent(sub);
          var box = document.getElementById("box-" + o.id);
          box.className = "copy-box active";
          box.innerHTML = "🔗 <strong>Click to Copy Tracking Link:</strong><br>" + finalUrl;
          box.onclick = function(){ navigator.clipboard.writeText(finalUrl); alert("Copied to Clipboard! 🎉"); };
        };
      }
    });

  } else if (activeViewTab === "ranks") {
    app.innerHTML =
      "<div class='card'>" +
        "<h3 style='margin:0 0 14px; color:#fff;'>Top Network Affiliates 🏆</h3>" +
        topUsers.map(function(u, idx){
          var badge = idx === 0 ? "🥇" : (idx === 1 ? "🥈" : (idx === 2 ? "🥉" : "#" + (idx + 1)));
          var maskedName = u.username.length > 3 ? u.username.substring(0,3) + "***" : u.username;
          return "<div class='rank-row'>" +
            "<div style='display:flex; align-items:center; gap:10px;'><div class='rank-num'>" + badge + "</div><strong>" + esc(maskedName) + "</strong></div>" +
            "<div style='color:var(--accent-gold); font-family:var(--font-mono); font-weight:700;'>" + (u.custom_conversions || 0) + " Leads</div>" +
          "</div>";
        }).join("") +
      "</div>";

  } else if (activeViewTab === "wallet") {
    app.innerHTML =
      "<div class='card'>" +
        "<h3 style='margin:0 0 12px; color:#fff;'>Payout History</h3>" +
        (payouts.length === 0 ? "<div style='font-size:12px; color:var(--text-secondary);'>No payouts found</div>" :
          payouts.map(function(p){
            return "<div style='display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);'>" +
              "<div><strong>৳" + p.amount + "</strong> (" + esc(p.method) + ")<br><small style='color:var(--text-secondary);'>" + new Date(p.created_at).toLocaleDateString() + "</small></div>" +
              "<div><span class='badge badge-" + p.status + "'>" + p.status + "</span></div>" +
            "</div>";
          }).join("")) +
      "</div>";
  }
}

function openWithdrawModal(avail){
  if (avail < MIN_WITHDRAW) return alert("Minimum withdrawal limit is ৳" + MIN_WITHDRAW);
  var modalSlot = document.getElementById("modalContainer");

  modalSlot.innerHTML =
    "<div class='modal-bg'><div class='modal-body'>" +
      "<h3 style='margin:0 0 14px; color:#fff;'>Request Payout</h3>" +
      "<label style='font-size:11px; color:var(--text-secondary);'>Select Payment Method</label>" +
      "<select id='wMeth' style='width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-dark); color:#fff; margin:4px 0 12px;'>" +
        "<option>Bkash</option><option>Nagad</option><option>Rocket</option><option>Bank Transfer</option>" +
      "</select>" +
      "<label style='font-size:11px; color:var(--text-secondary);'>Account Number</label>" +
      "<input id='wAcc' style='width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-dark); color:#fff; margin:4px 0 12px;' placeholder='017XXXXXXXX'>" +
      "<label style='font-size:11px; color:var(--text-secondary);'>Amount (৳)</label>" +
      "<input id='wAmt' type='number' value='" + avail + "' style='width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-dark); color:#fff; margin:4px 0 16px;'>" +
      "<button class='btn-primary' id='wSubmit'>Submit Request</button>" +
      "<button class='btn-sm' id='wClose' style='width:100%; margin-top:8px;'>Cancel</button>" +
    "</div></div>";

  document.getElementById("wClose").onclick = function(){ modalSlot.innerHTML = ""; };
  document.getElementById("wSubmit").onclick = async function(){
    var m = document.getElementById("wMeth").value;
    var a = document.getElementById("wAcc").value.trim();
    var amt = parseFloat(document.getElementById("wAmt").value) || 0;
    if (!a || amt < MIN_WITHDRAW || amt > avail) return alert("Invalid amount or account");

    await sb.from("payouts").insert({ user_id: currentProfile.id, username: currentProfile.username, method: m, account: a, amount: amt, status: "pending" });
    alert("Payout request submitted!");
    modalSlot.innerHTML = "";
    renderUserView();
  };
}

async function renderAdmin(){
  bottomNav.style.display = "none";
  var usersRes = await sb.from("profiles").select("*").neq("is_admin", true);
  var payoutsRes = await sb.from("payouts").select("*").order("created_at", { ascending: false });

  var users = usersRes.data || [];
  var payouts = payoutsRes.data || [];

  app.innerHTML =
    "<h2 style='color:#fff; margin:0 0 16px;'>Admin Control Hub</h2>" +
    "<div class='stats-grid'>" +
      "<div class='stat-card'><div class='stat-label'>Total Affiliates</div><div class='stat-val'>" + users.length + "</div></div>" +
      "<div class='stat-card'><div class='stat-label'>Pending Payouts</div><div class='stat-val' style='color:var(--accent-gold);'>" + payouts.filter(p=>p.status==='pending').length + "</div></div>" +
    "</div>" +

    "<div class='card'>" +
      "<h4 style='margin:0 0 12px; color:#fff;'>Pending Payout Requests</h4>" +
      (payouts.length === 0 ? "No pending requests" : payouts.map(function(p){
        return "<div style='display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);'>" +
          "<div><strong>" + esc(p.username) + "</strong> — ৳" + p.amount + "<br><small style='color:var(--text-secondary);'>" + esc(p.method) + ": " + esc(p.account) + "</small></div>" +
          "<div>" + (p.status === "pending" ? "<button class='btn-sm btn-success' data-paid='" + p.id + "'>Mark Paid</button>" : "<span class='badge badge-approved'>Paid</span>") + "</div>" +
        "</div>";
      }).join("")) +
    "</div>";

  document.querySelectorAll("[data-paid]").forEach(function(btn){
    btn.onclick = async function(){
      var pid = btn.getAttribute("data-paid");
      await sb.from("payouts").update({ status: "approved" }).eq("id", pid);
      renderAdmin();
    };
  });
}

init();
})();
</script>
</body>
</html>
